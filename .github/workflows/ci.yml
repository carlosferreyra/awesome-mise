name: Validate Catalog

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust nightly for standalone scripts
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache Cargo dependencies and script builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/build
          key: cargo-${{ runner.os }}-nightly-${{ hashFiles('scripts/**/*.rs') }}
          restore-keys: |
            cargo-${{ runner.os }}-nightly-
      - name: Validate catalog and recipe TOML
        run: cargo +nightly -Zscript scripts/checks.rs
      - name: Test maintenance checks
        run: cargo +nightly test -Zscript --manifest-path scripts/readme.rs
      - name: Check generated README
        run: cargo +nightly -Zscript scripts/readme.rs -- --check
      - name: Check whitespace
        run: git diff --check
